# Originless — all-in-one IPFS storage backend
#
#   docker compose up -d --build
#   open http://localhost:3232
#
# 3232 = API + dashboard + /ipfs gateway
# 4001 = libp2p swarm (publish TCP+UDP so peers can Bitswap your pins)
# Persist /data so pins survive recreates.

services:
  originless:
    build: .
    image: ${IMAGE:-originless:local}
    container_name: originless
    restart: unless-stopped
    ports:
      - "3232:3232"
      - "4001:4001"
      - "4001:4001/udp"
    environment:
      STORAGE_MAX: ${STORAGE_MAX:-100GB}
      PIN_EXPIRY_DAYS: ${PIN_EXPIRY_DAYS:-30}
      ENABLE_GATEWAY: ${ENABLE_GATEWAY:-true}
      IPFS_ROUTING: ${IPFS_ROUTING:-dhtclient}
      IPFS_PROFILE: ${IPFS_PROFILE:-lowpower}
      SWARM_ANNOUNCE: ${SWARM_ANNOUNCE:-}
      IPFS_PEER_NODES: ${IPFS_PEER_NODES:-}
      IPFS_SWARM_CONNECT: ${IPFS_SWARM_CONNECT:-}
      NOSTR_NPUBS: ${NOSTR_NPUBS:-}
      NOSTR_RELAYS: ${NOSTR_RELAYS:-}
    volumes:
      - originless-data:/data
      - originless-archive:/archive
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3232/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  originless-data:
  originless-archive:
