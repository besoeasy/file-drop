<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — Originless</title>
  <meta name="theme-color" content="#211e1e" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
<div id="app" class="shell">
  <div data-ol-nav></div>

  <main class="wrap">
    <div class="hero hero-row">
      <div>
        <p class="kicker">[*] Pinned content</p>
        <h1>Library</h1>
        <p>Recent uploads on this node. Search by filename or CID.</p>
      </div>
      <div class="hero-stats">
        <div class="tile hero-stat">
          <div class="kicker">Pinned</div>
          <div class="stat-value">{{ pinStats.count }}</div>
        </div>
        <div class="tile hero-stat">
          <div class="kicker">Size</div>
          <div class="stat-value">{{ pinStats.sizeStr }}</div>
        </div>
      </div>
    </div>

    <section>
      <div class="card-head">
        <h2>Upload history</h2>
        <div class="search">
          <i class="fas fa-magnifying-glass"></i>
          <input v-model="searchQuery" class="field" type="text" placeholder="Search filename or CID" />
        </div>
      </div>
      <div v-if="filteredHistory.length === 0" class="empty">
        <template v-if="history.length === 0">[*] No uploads yet. Upload files via the HTTP API or client examples.</template>
        <template v-else>[*] No matches for “{{ searchQuery }}”.</template>
      </div>
      <div v-else class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>File</th>
              <th>CID</th>
              <th style="text-align:right">Size</th>
              <th style="text-align:right">Status</th>
              <th style="text-align:right">Date</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in filteredHistory" :key="item.cid">
              <td><div class="truncate" style="max-width:14rem">{{ item.filename }}</div></td>
              <td><div class="mono faint truncate" style="max-width:12rem" :title="item.cid">{{ item.cid }}</div></td>
              <td style="text-align:right" class="muted">{{ formatBytes(item.size) }}</td>
              <td style="text-align:right">
                <span v-if="item.unpinned" class="pill pill-mute">unpinned</span>
                <span v-else class="pill pill-ok">pinned</span>
              </td>
              <td style="text-align:right" class="faint">{{ formatDate(item.created_at) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div data-ol-foot></div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/app.js"></script>
<script>
  OL.injectChrome("library");
  const { createApp } = Vue;
  createApp({
    mixins: [OL.pageMixin()],
    data() { return { searchQuery: "" }; },
    computed: {
      filteredHistory() {
        if (!this.searchQuery) return this.history;
        const q = this.searchQuery.toLowerCase();
        return this.history.filter((h) =>
          (h.filename || "").toLowerCase().includes(q) ||
          (h.cid || "").toLowerCase().includes(q)
        );
      },
    },
    mounted() {
      this.fetchHistory();
      this.fetchPinStats();
    },
  }).mount("#app");
</script>
</body>
</html>
