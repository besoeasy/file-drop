<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Originless — Examples</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root { --fg: #0a0a0a; --muted: #6b7280; --line: #e5e7eb; --brand: #ef4444; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--fg);
      background: #fff; max-width: 40rem; margin-inline: auto; padding: 1.5rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    p.lead { color: var(--muted); font-size: .9rem; margin: 0 0 1.25rem; }
    a.back { color: var(--muted); font-size: .8rem; text-decoration: none; display: inline-block; margin-bottom: 1.25rem; }
    a.back:hover { color: var(--fg); }
    a.card {
      display: block; border: 1px solid var(--line); border-radius: 12px;
      padding: 1rem 1.1rem; text-decoration: none; color: inherit;
    }
    a.card:hover { border-color: #fca5a5; }
    a.card h2 { font-size: 1rem; margin: 0 0 .35rem; }
    a.card p { margin: 0; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <a class="back" href="/">← Originless</a>
  <h1>Examples</h1>
  <p class="lead">Small pages that talk to this node. Open them in the same origin as Originless.</p>
  <a class="card" href="/examples/post.html">
    <h2>Post to Nostr with ipfs://</h2>
    <p>Connect a NIP-07 extension, upload an image, and publish kind 1 + 1063 events.</p>
  </a>
</body>
</html>
